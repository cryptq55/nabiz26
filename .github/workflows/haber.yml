name: Bildir ve paylaş

# Site, Cloudflare'in GitHub bağlantısıyla her gönderimde otomatik yayınlanır.
# Bu iş akışı yayının bitmesini bekleyip yeni haberleri IndexNow ile Bing ve Yandex'e bildirir
# ve (IG_USER_ID, IG_ACCESS_TOKEN tanımlıysa) Instagram'da story/gönderi olarak paylaşır.
on:
  push:
    branches: [main]
    paths: ["data/articles/**"]
  workflow_dispatch:
    inputs:
      reel:
        description: "Reels'i yapılacak haberin adresinden bir parça (boş bırakılırsa önem puanına göre seçilir)"
        required: false
        default: ""

permissions:
  contents: write   # Instagram paylaşım kaydını (data/instagram.json) güncellemek için

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bildirilecek adresleri hazırla
        env:
          SITE_URL: https://nabiz26.com
          LINK_EXT: ""
        run: python build.py
      - name: Cloudflare yayınını bekle
        run: sleep 180
      - name: IndexNow (Bing, Yandex)
        run: |
          KEY=$(ls public/*.txt | xargs -n1 basename | grep -E '^[0-9a-f]{40}\.txt$' | head -1 | sed 's/\.txt$//')
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u for u in open("indexnow-urls.txt").read().split() if u][:1000]
          body = json.dumps({"host": "nabiz26.com", "key": key, "keyLocation": f"https://nabiz26.com/{key}.txt", "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://yandex.com/indexnow"):
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  print(ep, urllib.request.urlopen(req, timeout=20).status, len(urls))
              except Exception as e:
                  print(ep, "hata:", e)
          PY

      - name: Instagram ve Facebook'ta paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Reels: video Cloudflare R2'ye yüklenir (tanımlı değilse Reels atlanır)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Seslendirme: OpenAI (ya da ElevenLabs); tanımlı değilse Reels sessiz üretilir
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # Facebook sayfası (tanımlı değilse atlanır)
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          REEL_SLUG: ${{ github.event.inputs.reel }}
        run: |
          if [ -n "$R2_BUCKET" ]; then pip install -q boto3 imageio-ffmpeg; fi
          python3 instagram.py
          python3 facebook.py || echo "facebook paylaşımı hata verdi"
          git config user.name "nabiz26-bot"
          git config user.email "nabiz26-bot@users.noreply.github.com"
          git add data/instagram.json data/facebook.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Instagram paylaşım kaydı"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
