name: CLIProxy bağlantısı (yayınsız)

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Adres
        env:
          BASE: ${{ vars.NEWS_PROXY_TEST_BASE }}
        run: echo "Denenen adres - $BASE"
      - uses: tailscale/github-action@v4
        # Funnel (https://...ts.net) adresi internete açık; özel ağa bağlanmak yalnızca 100.x adresi için gerekir
        if: startsWith(vars.NEWS_PROXY_TEST_BASE, 'http://100.')
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:nabiz26-ci
      - name: Bağlantıyı ve haber kararını doğrula
        env:
          NEWS_API_BASE: ${{ vars.NEWS_PROXY_TEST_BASE }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_MODEL: ${{ vars.NEWS_API_MODEL }}
        run: |
          python - <<'PY'
          import newsbot, os, requests
          base = os.environ['NEWS_API_BASE'].rstrip('/')
          r = requests.get(base + '/models', headers={'Authorization': 'Bearer ' + os.environ['NEWS_API_KEY']}, timeout=20)
          r.raise_for_status()
          model = os.environ.get('NEWS_API_MODEL') or 'gpt-6.1-sol'
          assert model in [m['id'] for m in r.json()['data']], 'Seçilen model listede yok'
          a = newsbot.write_article_proxy({'source_name': 'Bağlantı testi', 'title': 'Yayınsız test'},
              'Bu yalnızca bağlantı testidir; doğrulanabilir haber malzemesi içermez. Haber yayınlama.', [])
          assert a['publish'] is False, 'Yayınsız test yanlışlıkla yayın kararı verdi'
          print('CLIProxy modeli ve editör JSON şeması doğrulandı:', model)
          PY
