# Haber kaynakları. RSS adresi olan her siteyi buraya ekleyebilirsiniz.
# Not: kurumların RSS adresleri değişebilir; çalışmayan bir kaynak sistemi durdurmaz, sadece atlanır.
feeds:
  # Google News araması: Eskişehir geçen güncel haberleri bulur (keşif amaçlı)
  - name: Google Haberler - Eskişehir
    url: https://news.google.com/rss/search?q=Eski%C5%9Fehir+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: yerel
    brand_cover: true   # gazete fotoğrafı yerine kendi kapağımız (Büyükşehir gibi yurt dışından okunamayan kurumların haberleri de buradan gelir)
  - name: Google Haberler - Odunpazarı
    url: https://news.google.com/rss/search?q=Odunpazar%C4%B1+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: yerel
    brand_cover: true
  - name: Google Haberler - Tepebaşı
    url: https://news.google.com/rss/search?q=Tepeba%C5%9F%C4%B1+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: yerel
    brand_cover: true
  - name: Google Haberler - Eskişehirspor
    url: https://news.google.com/rss/search?q=Eski%C5%9Fehirspor+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: yerel
    brand_cover: true
  # Konu kaynağı: Togg haberleri (Eskişehir şartı yok; gazete fotoğrafı yerine marka kapağı üretilir)
  - name: Google Haberler - Togg
    url: https://news.google.com/rss/search?q=Togg+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: togg
    brand_cover: true
  # Ulusal: Cumhurbaşkanı, ana muhalefet ve bakanlıklar (Eskişehir şartı yok; gazete fotoğrafı yerine marka kapağı)
  - name: Google Haberler - Cumhurbaşkanı
    url: https://news.google.com/rss/search?q=Cumhurba%C5%9Fkan%C4%B1+Erdo%C4%9Fan+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: siyaset
    brand_cover: true
  - name: Google Haberler - CHP
    url: https://news.google.com/rss/search?q=CHP+Genel+Ba%C5%9Fkan%C4%B1+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: siyaset
    brand_cover: true
  - name: Google Haberler - Bakanlıklar
    url: https://news.google.com/rss/search?q=Bakanl%C4%B1%C4%9F%C4%B1+a%C3%A7%C4%B1klad%C4%B1+when:1d&hl=tr&gl=TR&ceid=TR:tr
    topic: bakanlik
    brand_cover: true

# RSS'i olmayan resmî kurum siteleri: ajan sayfadaki haber bağlantılarını bulup okur.
# Bu kaynakların fotoğrafları (basın kullanımına açık) haberle birlikte, kaynak belirtilerek kullanılır.
#   url:           haberlerin listelendiği sayfa (ana sayfa da olur)
#   link_contains: haber bağlantılarının adresinde geçen ifade (varsayılan "haber")
#   link_text:     adreste ipucu yoksa, haber bağlantısının metninin başına uyan düzenli ifade
#                  (eşleşen kısım başlıktan atılır; verilirse link_contains'e bakılmaz)
#   limit:         sayfadan en fazla kaç bağlantı alınsın (varsayılan 15)
# Adresler deneme çalıştırmasında kontrol edilmeli; çalışmayan kaynak sadece uyarı verir.
pages:
  - name: Eskişehir Valiliği
    url: https://www.eskisehir.gov.tr/haberler
    link_text: '\d{2}\.\d{2}\.\d{4}\s'
  - name: Eskişehir Büyükşehir Belediyesi
    url: https://www.eskisehir.bel.tr/
    link_contains: icerik-detay
  - name: Odunpazarı Belediyesi
    url: https://www.odunpazari.bel.tr/
  - name: Tepebaşı Belediyesi
    url: https://www.tepebasi.bel.tr/
  - name: Anadolu Üniversitesi
    url: https://anahaber.anadolu.edu.tr/tr
    link_contains: haber-detay
  - name: Eskişehir Osmangazi Üniversitesi
    url: https://www.ogu.edu.tr/
  - name: Eskişehir Teknik Üniversitesi
    url: https://www.eskisehir.edu.tr/
  # İlçe belediyeleri
  - name: Alpu Belediyesi
    url: https://www.alpu.bel.tr/
  - name: Beylikova Belediyesi
    url: https://www.beylikova.bel.tr/
  - name: Günyüzü Belediyesi
    url: https://www.gunyuzu.bel.tr/
  - name: Mihalıççık Belediyesi
    url: https://www.mihaliccik.bel.tr/
  - name: Seyitgazi Belediyesi
    url: https://www.seyitgazi.bel.tr/
  # İl müdürlükleri
  - name: Eskişehir İl Tarım ve Orman Müdürlüğü
    url: https://eskisehir.tarimorman.gov.tr/
  - name: Eskişehir Gençlik ve Spor İl Müdürlüğü
    url: https://eskisehir.gsb.gov.tr/
  - name: Eskişehir İl Kültür ve Turizm Müdürlüğü
    url: https://eskisehir.ktb.gov.tr/
  # Ulusal resmî kaynaklar (fotoğraflar resmî)
  - name: İletişim Başkanlığı
    url: https://www.iletisim.gov.tr/turkce/haberler
    topic: siyaset
    limit: 5
  - name: Aile ve Sosyal Hizmetler Bakanlığı
    url: https://www.aile.gov.tr/haberler/
    topic: bakanlik
    limit: 4
  - name: Milli Eğitim Bakanlığı
    url: https://www.meb.gov.tr/
    topic: bakanlik
    limit: 4
  - name: Enerji ve Tabii Kaynaklar Bakanlığı
    url: https://enerji.gov.tr/
    link_contains: haber-detay
    topic: bakanlik
    limit: 4
