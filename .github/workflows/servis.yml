name: Kent servisleri

# Hava durumu ve namaz vakitleri verisini (servis.py) 3 saatte bir yeniler; data/servis.json değişince
# Cloudflare siteyi yeniden derler ve /hava-durumu, /namaz-vakitleri sayfaları güncellenir.
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: servis
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python servis.py
      - name: Kaydet
        run: |
          git config user.name "nabiz26-bot"
          git config user.email "nabiz26-bot@users.noreply.github.com"
          git add data/servis.json data/articles data/images
          if ! git diff --cached --quiet; then
            git commit -q -m "Kent servisleri güncellendi"
            for i in 1 2 3; do git pull --rebase -X ours -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
