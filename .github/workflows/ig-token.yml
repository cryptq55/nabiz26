name: Instagram token yenile

# Instagram girişli token 60 gün geçerli. Bu iş akışı haftada bir token'ı yeniler ve
# IG_ACCESS_TOKEN gizli değişkenini günceller. GITHUB_TOKEN gizli değişken yazamadığı için
# GH_SECRETS_TOKEN gerekir: yalnızca bu depo için, "Secrets: Read and write" izinli
# fine-grained kişisel erişim token'ı.
on:
  schedule:
    - cron: "17 3 * * 1"   # Pazartesi 06:17 (TR)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Token'ı yenile ve kaydet
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
            echo "IG_ACCESS_TOKEN veya GH_SECRETS_TOKEN tanımlı değil; atlandı."
            exit 0
          fi
          NEW=$(python3 instagram.py --refresh)
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "IG_ACCESS_TOKEN güncellendi."
