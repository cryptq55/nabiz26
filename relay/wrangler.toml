# Yurt dışı IP'leri engelleyen kurum sitelerine (ör. Büyükşehir) haber masasının ulaşabilmesi için küçük aktarıcı.
# Yalnızca index.js'deki listedeki sitelere GET isteği iletir; yanıtlar 10 dakika önbellekte tutulur.
name = "nabiz26-relay"
main = "index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "FETCHER"
