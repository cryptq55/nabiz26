name: Aktarıcıyı yayınla

# Cloudflare Worker "nabiz26-relay" (relay/): yurt dışı IP engelli kurum sitelerini okuyan aktarıcı.
on:
  push:
    branches: [main]
    paths: ["relay/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 66d63c4b2b3023f07dde98658cf5f696
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes wrangler@4.158.0 deploy --config ./wrangler.toml
