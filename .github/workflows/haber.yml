name: Bildir ve paylaş

# Site, Cloudflare'in GitHub bağlantısıyla her gönderimde otomatik yayınlanır.
# Bu iş akışı yayının bitmesini bekleyip yeni haberleri IndexNow ile Bing ve Yandex'e bildirir
# ve (IG_USER_ID, IG_ACCESS_TOKEN tanımlıysa) Instagram'da story/gönderi olarak paylaşır.
on:
  push:
    branches: [main]
    paths: ["data/articles/**"]
  workflow_dispatch:

permissions:
  contents: write   # Instagram paylaşım kaydını (data/instagram.json) güncellemek için

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bildirilecek adresleri hazırla
        env:
          SITE_URL: https://nabiz26.com
          LINK_EXT: ""
        run: python build.py
      - name: Cloudflare yayınını bekle
        run: sleep 180
      - name: IndexNow (Bing, Yandex)
        run: |
          KEY=$(ls public/*.txt | xargs -n1 basename | grep -E '^[0-9a-f]{40}\.txt$' | head -1 | sed 's/\.txt$//')
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u for u in open("indexnow-urls.txt").read().split() if u][:1000]
          body = json.dumps({"host": "nabiz26.com", "key": key, "keyLocation": f"https://nabiz26.com/{key}.txt", "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://yandex.com/indexnow"):
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  print(ep, urllib.request.urlopen(req, timeout=20).status, len(urls))
              except Exception as e:
                  print(ep, "hata:", e)
          PY

      - name: Instagram'da paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 instagram.py
          git config user.name "nabiz26-bot"
          git config user.email "nabiz26-bot@users.noreply.github.com"
          git add data/instagram.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Instagram paylaşım kaydı"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
