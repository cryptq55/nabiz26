name: Siteyi yayınla

# Haberleri "Nabız 26 haber masası" oturumu yazıp main dalına gönderir.
# Bu iş akışı her gönderimde siteyi üretir ve Cloudflare Pages'e yükler.
# Yayın kapalıyken çalışmaz. Açmak için:
# Settings → Secrets and variables → Actions → Variables → YAYIN_AKTIF = true
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "OTURUM.md", "SON_HABERLER.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yayin
  cancel-in-progress: true   # üst üste gönderimde yalnızca en güncel hali yayınla

jobs:
  yayin:
    if: vars.YAYIN_AKTIF == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Siteyi üret
        env:
          SITE_NAME: ${{ vars.SITE_NAME || 'Nabız 26' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://nabiz26.com' }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL || 'iletisim@nabiz26.com' }}
        run: python build.py

      - name: Cloudflare Pages'e yükle
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=nabiz26 --branch=main
